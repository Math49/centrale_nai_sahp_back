name: centrale-ni-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ni
      POSTGRES_PASSWORD: ni
      POSTGRES_DB: centrale_ni
    ports:
      - '5432:5432'
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ni -d centrale_ni']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Ces valeurs font autorité : le .env de l'hôte est visible dans le
    # conteneur par le montage, mais les variables réelles le supplantent.
    # Toute variable ajoutée à src/config/environnement.ts doit être reprise ici.
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://ni:ni@postgres:5432/centrale_ni?schema=public
      CORS_ORIGINES: http://localhost:3001
      SWAGGER_ACTIF: 'true'
      # Secret de développement, sans valeur : la production reçoit le sien
      # par le fichier d'environnement du serveur (lot 12).
      JWT_SECRET: developpement-uniquement-secret-sans-valeur-32c
      JWT_DUREE: 12h
    ports:
      - '3000:3000'
    volumes:
      # Le code est monté ; node_modules reste celui de l'image, pour ne pas
      # mélanger les binaires natifs de l'hôte et du conteneur.
      #
      # dist/ n'est volontairement pas un volume : `nest build` efface le
      # dossier de sortie avant de compiler, et un point de montage ne peut pas
      # être supprimé — le conteneur redémarrerait en boucle sur EBUSY.
      - .:/app
      - modules_api:/app/node_modules
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm run start:dev"

volumes:
  donnees_postgres:
  modules_api:
