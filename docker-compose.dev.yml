name: centrale-ni-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ni
      POSTGRES_PASSWORD: ni
      POSTGRES_DB: centrale_ni
    ports:
      - '5432:5432'
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ni -d centrale_ni']
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@centrale-ni.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_donnees:/var/lib/pgadmin

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy


    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://ni:ni@postgres:5432/centrale_ni?schema=public
      CORS_ORIGINES: http://localhost:3001
      SWAGGER_ACTIF: 'true'


      JWT_SECRET: developpement-uniquement-secret-sans-valeur-32c
      JWT_DUREE: 7d

      COOKIE_SECURE: 'false'

      VIEILLISSEMENT_JOURS: 30
      FICHIERS_RACINE: /app/donnees/fichiers
      FICHIER_TAILLE_MAX_MO: 8
    ports:
      - '3000:3000'
    volumes:


      - .:/app
      - modules_api:/app/node_modules
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm run start:dev"

volumes:
  donnees_postgres:
  pgadmin_donnees:
  modules_api:
