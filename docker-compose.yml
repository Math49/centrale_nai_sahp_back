name: centrale-ni

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-40512}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?renseigner PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?renseigner PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-40513}:80'
    volumes:
      - pgadmin_donnees:/var/lib/pgadmin

  api:
    image: ghcr.io/math49/centrale_nai_sahp_back:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '40511'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      CORS_ORIGINES: ${CORS_ORIGINES:?renseigner CORS_ORIGINES}
      SWAGGER_ACTIF: 'false'
      JWT_SECRET: ${JWT_SECRET}
      JWT_DUREE: ${JWT_DUREE:-7d}
      SUPER_ADMIN_MATRICULE: ${SUPER_ADMIN_MATRICULE:?renseigner SUPER_ADMIN_MATRICULE}
      SUPER_ADMIN_PRENOM: ${SUPER_ADMIN_PRENOM:?renseigner SUPER_ADMIN_PRENOM}
      SUPER_ADMIN_NOM: ${SUPER_ADMIN_NOM:?renseigner SUPER_ADMIN_NOM}
      SUPER_ADMIN_MOT_DE_PASSE: ${SUPER_ADMIN_MOT_DE_PASSE:?renseigner SUPER_ADMIN_MOT_DE_PASSE}
      SUPER_ADMIN_GRADE: ${SUPER_ADMIN_GRADE:-etat_major}
      COOKIE_SECURE: 'true'
      VIEILLISSEMENT_JOURS: ${VIEILLISSEMENT_JOURS:-30}
      FICHIERS_RACINE: /app/donnees/fichiers
      FICHIER_TAILLE_MAX_MO: ${FICHIER_TAILLE_MAX_MO:-8}
    ports:
      - '127.0.0.1:${API_PORT:-40511}:40511'
    volumes:
      - fichiers:/app/donnees/fichiers
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:40511/sante').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  sauvegarde:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: postgres
      RETENTION_JOURS: ${RETENTION_JOURS:-14}
      HEURE_SAUVEGARDE: ${HEURE_SAUVEGARDE:-03}
    volumes:
      - fichiers:/source/fichiers:ro
      - sauvegardes:/sauvegardes
      - ./deploiement/sauvegarder.sh:/usr/local/bin/sauvegarder.sh:ro
      - ./deploiement/restaurer.sh:/usr/local/bin/restaurer.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/sauvegarder.sh', 'boucle']

volumes:
  donnees_postgres:
  pgadmin_donnees:
  fichiers:
  sauvegardes:
